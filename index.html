<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine To-Do-Liste</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --danger: #e11d48;
    --danger-hover: #be123c;
    --text: #1f2937;
    --muted: #9ca3af;
    --border: #e5e7eb;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }

  .app {
    width: 100%;
    max-width: 480px;
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    padding: 28px;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 1.6rem;
    text-align: center;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  #task-input {
    flex: 1;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s;
  }

  #task-input:focus {
    border-color: var(--primary);
  }

  #add-btn {
    padding: 10px 18px;
    font-size: 1rem;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }

  #add-btn:hover {
    background: var(--primary-hover);
  }

  .hint {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 16px 2px;
    min-height: 1em;
  }

  ul#task-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  ul#task-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }

  ul#task-list li:last-child {
    border-bottom: none;
  }

  ul#task-list li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--primary);
  }

  ul#task-list li .task-text {
    flex: 1;
    word-break: break-word;
    cursor: pointer;
  }

  ul#task-list li.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }

  ul#task-list li .delete-btn {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--danger);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s, color 0.15s;
  }

  ul#task-list li .delete-btn:hover {
    background: #fee2e2;
    color: var(--danger-hover);
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 20px 0;
    font-size: 0.95rem;
  }

  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }

  #clear-completed-btn {
    border: none;
    background: transparent;
    color: var(--primary);
    cursor: pointer;
    font-size: 0.85rem;
  }

  #clear-completed-btn:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="app">
  <h1>Meine To-Do-Liste</h1>

  <form id="task-form" class="input-row">
    <input type="text" id="task-input" placeholder="Neue Aufgabe eingeben..." autocomplete="off">
    <button type="submit" id="add-btn">Hinzufügen</button>
  </form>
  <p class="hint" id="hint"></p>

  <ul id="task-list"></ul>
  <p class="empty-state" id="empty-state">Noch keine Aufgaben. Fügen Sie oben eine hinzu!</p>

  <div class="footer-row">
    <span id="task-count"></span>
    <button type="button" id="clear-completed-btn">Erledigte löschen</button>
  </div>
</div>

<script>
  const STORAGE_KEY = "todo-tasks";

  const form = document.getElementById("task-form");
  const input = document.getElementById("task-input");
  const list = document.getElementById("task-list");
  const emptyState = document.getElementById("empty-state");
  const hint = document.getElementById("hint");
  const taskCount = document.getElementById("task-count");
  const clearCompletedBtn = document.getElementById("clear-completed-btn");

  let tasks = loadTasks();

  function loadTasks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function render() {
    list.innerHTML = "";

    if (tasks.length === 0) {
      emptyState.style.display = "block";
    } else {
      emptyState.style.display = "none";
    }

    tasks.forEach(task => {
      const li = document.createElement("li");
      if (task.completed) li.classList.add("completed");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.completed;
      checkbox.addEventListener("change", () => toggleTask(task.id));

      const span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;
      span.addEventListener("click", () => toggleTask(task.id));

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "delete-btn";
      deleteBtn.type = "button";
      deleteBtn.textContent = "✕";
      deleteBtn.setAttribute("aria-label", "Aufgabe löschen");
      deleteBtn.addEventListener("click", () => deleteTask(task.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(deleteBtn);
      list.appendChild(li);
    });

    const openCount = tasks.filter(t => !t.completed).length;
    taskCount.textContent = tasks.length === 0
      ? ""
      : `${openCount} offen von ${tasks.length}`;
  }

  function addTask(text) {
    const trimmed = text.trim();
    if (!trimmed) {
      hint.textContent = "Bitte eine Aufgabe eingeben.";
      return;
    }
    hint.textContent = "";
    tasks.push({
      id: Date.now() + Math.random().toString(16).slice(2),
      text: trimmed,
      completed: false
    });
    saveTasks();
    render();
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.completed = !task.completed;
      saveTasks();
      render();
    }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    render();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    addTask(input.value);
    input.value = "";
    input.focus();
  });

  clearCompletedBtn.addEventListener("click", () => {
    tasks = tasks.filter(t => !t.completed);
    saveTasks();
    render();
  });

  render();
</script>

</body>
</html>
